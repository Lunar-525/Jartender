[package]
name = "jartender-desktop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Jartender Minecraft server desktop manager"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jartender = { path = "../..", default-features = false }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
