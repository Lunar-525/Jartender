name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
      - run: cargo doc --locked --no-deps --no-default-features
      - run: cargo build --release --locked
      - name: Package executable
        shell: bash
        run: tar -czf jartender.tar.gz -C target/release jartender${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: jartender-${{ matrix.os }}
          path: jartender.tar.gz
          if-no-files-found: error
