[package]
name = "jartender"
version = "0.1.0"
edition = "2024"
description = "Install and run Minecraft servers from the terminal"
license = "GPL-3.0-only"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:clap_complete", "dep:comfy-table", "dep:humansize"]

[[bin]]
name = "jartender"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.6", features = ["derive"], optional = true }
clap_complete = { version = "4.6", optional = true }
comfy-table = { version = "8", optional = true }
humansize = { version = "2", optional = true }
java-properties = "2"
encoding_rs = "0.8"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", features = ["socks-proxy"] }
zip = { version = "9.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
quick-xml = { version = "0.42", features = ["serialize"] }
version-compare = "0.2"
process_control = "5.2"
scraper = { version = "0.24", default-features = false }
tar = "0.4"
flate2 = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
lto = "thin"
strip = true
